<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;direction:rtl;background:#070d1a;color:#e8eeff;min-height:100vh}
:root{--accent:#38bdf8;--accent2:#818cf8;--success:#22c55e;--warn:#f59e0b;--danger:#f43f5e;--border:rgba(255,255,255,0.08);--surface:rgba(255,255,255,0.04)}
.hidden{display:none!important}
/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,rgba(56,189,248,0.1),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(129,140,248,0.08),transparent 60%),#070d1a}
.login-box{width:100%;max-width:380px}
.logo-center{text-align:center;margin-bottom:32px}
.logo-svg{margin-bottom:12px}
.logo-title{font-size:30px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:13px;color:rgba(232,238,255,0.5);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px}
.field-label{font-size:12px;color:rgba(232,238,255,0.5);margin-bottom:6px}
.inp{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:#e8eeff;font-size:14px;font-family:'Cairo',sans-serif;outline:none;margin-bottom:14px}
.inp:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#070d1a;font-size:16px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif}
.btn{padding:9px 16px;border-radius:10px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;transition:opacity 0.2s}
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:#e8eeff}
.btn-success{background:#22c55e;color:#070d1a}
.btn-danger{background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.3);color:var(--danger)}
.btn-sm{padding:5px 12px;font-size:11px}
.error-box{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.3);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:14px}
/* SHELL */
#app-screen{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,0.025);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.topbar-logo{font-size:18px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-right{margin-right:auto;display:flex;align-items:center;gap:10px}
.navtabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.015);overflow-x:auto;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtab{padding:11px 16px;border:none;background:none;color:rgba(232,238,255,0.45);font-weight:500;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s}
.navtab.active{color:var(--accent);font-weight:800;border-bottom-color:var(--accent)}
.page{flex:1;padding:20px 18px;overflow:auto}
/* COMPONENTS */
.page-title{font-size:20px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;border-top-width:3px;border-top-style:solid}
.kpi-val{font-size:24px;font-weight:900;margin-bottom:2px}
.kpi-label{font-size:11px;color:rgba(232,238,255,0.5)}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:rgba(232,238,255,0.5);font-weight:700;padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
td{font-size:13px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:center}
.alert-danger{background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.25)}
.alert-warn{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25)}
.alert-info{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-box{background:#0d1829;border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:900;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;margin-top:14px}
/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sel{width:100%;background:#0d1829;border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:#e8eeff;font-size:13px;font-family:'Cairo',sans-serif;outline:none;margin-bottom:10px}
/* SPINNER */
.spinner{text-align:center;padding:40px;color:rgba(232,238,255,0.4);font-size:14px}
/* PRODUCT GRID */
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.prod-top{padding:16px 12px 10px;text-align:center;background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(129,140,248,0.05))}
.prod-bot{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.qty-row{display:flex;align-items:center;gap:6px;background:rgba(56,189,248,0.08);border-radius:8px;padding:2px 6px}
.qty-btn{width:24px;height:24px;border-radius:6px;background:rgba(56,189,248,0.15);border:none;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-btn{width:32px;height:32px;border-radius:9px;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);color:var(--accent);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ORDER CARD */
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;border-right-width:3px;border-right-style:solid}
/* PROGRESS */
.progress-wrap{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width 0.5s}
/* CAT FILTER */
.cat-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cat-btn{padding:8px 18px;border-radius:50px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:rgba(232,238,255,0.5);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;font-family:'Cairo',sans-serif;transition:all 0.2s}
.cat-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#070d1a;font-weight:800}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>

<script>
// ═══════════════════════════════════════
//  SUPABASE INIT
// ═══════════════════════════════════════
const { createClient } = supabase
const db = createClient(
  'https://uadegxrgshjyxyvrmwbd.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhZGVneHJnc2hqeXh5dnJtd2JkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjcyNDEsImV4cCI6MjA5MjcwMzI0MX0.t6VXQGQ4U8YRawf1PvbolyhiaRZP8nROXQCUO6WWYzk'
)

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let currentUser = null
let allProducts = []
let allOrders   = []
let allUsers    = []
let allExpenses = []
let cart        = {}
let activeTab   = ''

// ═══════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════
document.getElementById('inp-password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin() })

async function doLogin() {
  const username = document.getElementById('inp-username').value.trim()
  const password = document.getElementById('inp-password').value.trim()
  const errEl = document.getElementById('login-error')
  errEl.classList.add('hidden')

  try {
    const { data, error } = await db.from('users')
      .select('*').eq('username', username).eq('active', true).single()

    if (error || !data) throw new Error('المستخدم غير موجود')
    if (data.password_hash !== password) throw new Error('كلمة المرور غير صحيحة')

    currentUser = data
    document.getElementById('login-screen').classList.add('hidden')
    document.getElementById('app-screen').classList.remove('hidden')
    initApp()
  } catch(e) {
    errEl.textContent = '⚠️ ' + e.message
    errEl.classList.remove('hidden')
  }
}

function doLogout() {
  currentUser = null; cart = {}
  document.getElementById('app-screen').classList.add('hidden')
  document.getElementById('login-screen').classList.remove('hidden')
  document.getElementById('inp-password').value = ''
}

// ═══════════════════════════════════════
//  APP INIT
// ═══════════════════════════════════════
const ROLE_TABS = {
  superadmin:   [{k:'dashboard',l:'📊 لوحة التحكم'},{k:'users',l:'👥 المستخدمون'},{k:'products',l:'📦 المنتجات'},{k:'orders',l:'🛒 الطلبات'},{k:'costs',l:'💰 التكاليف'}],
  orders_admin: [{k:'new_orders',l:'📥 طلبات جديدة'},{k:'ready_orders',l:'📦 جاهزة للشحن'},{k:'transit_orders',l:'🚚 في الطريق'}],
  stock_admin:  [{k:'stock',l:'🏭 المخزن'}],
  driver:       [{k:'my_orders',l:'🚚 طلباتي'},{k:'done_orders',l:'✅ المُسلَّمة'}],
  customer:     [{k:'shop',l:'🛒 الطلب'},{k:'my_history',l:'📋 طلباتي'},{k:'points',l:'⭐ نقاطي'}],
}

async function initApp() {
  const role = currentUser.role
  document.getElementById('user-badge').textContent = {superadmin:'👑 Super Admin',orders_admin:'📋 مسؤول الطلبات',stock_admin:'🏭 مسؤول المخزن',driver:'🚗 سائق',customer:'👤 زبون'}[role] + ' — ' + currentUser.name

  const tabs = ROLE_TABS[role] || []
  const nav = document.getElementById('navtabs')
  nav.innerHTML = tabs.map(t => `<button class="navtab" onclick="switchTab('${t.k}')">${t.l}</button>`).join('')

  await loadData()
  switchTab(tabs[0]?.k || '')
}

async function loadData() {
  const [p, o, u, e] = await Promise.all([
    db.from('products').select('*').eq('active', true).order('category'),
    db.from('orders').select('*, order_items(*)').order('created_at', {ascending:false}),
    db.from('users').select('id,name,username,role,phone,city,zone,points,active,created_at').order('created_at'),
    db.from('expenses').select('*').order('expense_date', {ascending:false}),
  ])
  allProducts = p.data || []
  allOrders   = (o.data || []).map(mapOrder)
  allUsers    = u.data || []
  allExpenses = e.data || []
}

function mapOrder(o) {
  return {
    id: o.id, customerId: o.customer_id, customerName: o.customer_name,
    phone: o.phone, address: o.address, city: o.city,
    subtotal: o.subtotal, delivery: o.delivery_fee, total: o.total,
    status: o.status, driverId: o.driver_id, driverName: o.driver_name,
    note: o.note, printed: o.printed, date: o.order_date,
    items: (o.order_items||[]).map(i=>({productId:i.product_id,name:i.name,emoji:i.emoji,qty:i.quantity,price:i.unit_price}))
  }
}

function switchTab(key) {
  activeTab = key
  document.querySelectorAll('.navtab').forEach((b,i)=>{
    const tabs = ROLE_TABS[currentUser.role]||[]
    b.classList.toggle('active', tabs[i]?.k === key)
  })
  renderPage()
}

// ═══════════════════════════════════════
//  RENDER ROUTER
// ═══════════════════════════════════════
function renderPage() {
  const el = document.getElementById('page-content')
  const renders = {
    dashboard: renderDashboard, users: renderUsers,
    products: renderProducts, orders: renderOrders, costs: renderCosts,
    new_orders: ()=>renderOrdersAdmin('pending'),
    ready_orders: ()=>renderOrdersAdmin('ready'),
    transit_orders: ()=>renderOrdersAdmin('in_transit'),
    stock: renderStock,
    my_orders: ()=>renderDriverOrders(false),
    done_orders: ()=>renderDriverOrders(true),
    shop: renderShop, my_history: renderMyHistory, points: renderPoints,
  }
  const fn = renders[activeTab]
  el.innerHTML = fn ? fn() : '<div class="spinner">الصفحة غير موجودة</div>'
}

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════

  pending:    {l:'قيد الانتظار', c:'#f59e0b'},
  ready:      {l:'جاهز للشحن',   c:'#a78bfa'},
  in_transit: {l:'في الطريق',    c:'#38bdf8'},
  delivered:  {l:'تم التسليم',   c:'#22c55e'},
  cancelled:  {l:'ملغي',         c:'#f43f5e'},
}
const badge = (label, color) => `<span class="badge" style="background:${color}22;color:${color}">${label}</span>`
const kpi   = (val, label, color, sub='') => `<div class="kpi" style="border-top-color:${color}"><div class="kpi-val" style="color:${color}">${val}</div><div class="kpi-label">${label}</div>${sub?`<div style="font-size:11px;color:${color};margin-top:3px">${sub}</div>`:''}</div>`
const daysUntil = d => Math.floor((new Date(d)-new Date())/86400000)

function printBDC(o) {
  const rows = o.items.map(i=>`<tr><td>${i.emoji} ${i.name}</td><td style="text-align:center">${i.qty}</td><td style="text-align:center">${i.price} دج</td><td style="text-align:center">${i.price*i.qty} دج</td></tr>`).join('')
  const w = window.open('','_blank')
  w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>BDC-${o.id}</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  *{box-sizing:border-box}body{font-family:'Cairo',sans-serif;padding:32px;color:#111;max-width:600px;margin:0 auto}
  h1{font-size:26px;font-weight:900;color:#0288d1}hr{border:none;border-top:3px double #0288d1;margin:14px 0}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .mb{background:#f8faff;border-radius:10px;padding:12px;border:1px solid #e2e8f0;font-size:13px}

  th{background:#0288d1;color:#fff;padding:9px 12px;text-align:right;font-size:12px}
  td{padding:9px 12px;border-bottom:1px solid #eef;font-size:13px}
  tr:nth-child(even) td{background:#f8faff}
  .tot{background:#f8faff;border-radius:10px;padding:14px}
  .tr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#555}

function renderDashboard() {
  const delivered = allOrders.filter(o=>o.status==='delivered')
  const revenue   = delivered.reduce((s,o)=>s+o.total,0)
  const expenses  = allExpenses.reduce((s,e)=>s+e.amount,0)
  const expired   = allProducts.filter(p=>daysUntil(p.expiry_date)<=0)
  const expiring  = allProducts.filter(p=>daysUntil(p.expiry_date)>0&&daysUntil(p.expiry_date)<=60)
  const lowStock  = allProducts.filter(p=>p.stock<p.min_stock)
  const today     = new Date().toISOString().split('T')[0]
  const todayOrders = allOrders.filter(o=>o.date===today)

  const alerts = [
    ...expired.map(p=>`<div class="alert alert-danger">🚨 <span><b>${p.name}</b> — انتهت الصلاحية!</span></div>`),
    ...expiring.map(p=>`<div class="alert alert-warn">⚠️ <span><b>${p.name}</b> — تنتهي خلال ${daysUntil(p.expiry_date)} يوم</span></div>`),
    ...lowStock.map(p=>`<div class="alert alert-info">📦 <span><b>${p.name}</b> — مخزون منخفض: ${p.stock} قطعة</span></div>`),
  ].join('')

  const recentRows = allOrders.slice(0,5).map(o=>`
    <tr><td style="color:var(--accent);font-weight:700;font-size:11px">${o.id}</td>
    <td>${o.customerName}</td>
    <td>${badge(STATUS[o.status]?.l||o.status, STATUS[o.status]?.c||'#888')}</td>
    <td style="font-weight:800">${o.total} دج</td></tr>`).join('')

  return `
    <div class="page-title">📊 لوحة التحكم</div>
    ${alerts}
    <div class="kpi-grid">
      ${kpi(revenue.toLocaleString()+' دج','إجمالي المبيعات','#38bdf8')}
      ${kpi((revenue-expenses).toLocaleString()+' دج','الربح الصافي',revenue-expenses>=0?'#22c55e':'#f43f5e')}
      ${kpi(todayOrders.length,'طلبات اليوم','#818cf8')}
      ${kpi(allUsers.filter(u=>u.active).length,'المستخدمون النشطون','#f59e0b')}
    </div>
    <div class="table-card">
      <div style="font-size:14px;font-weight:800;margin-bottom:12px">🛒 آخر الطلبات</div>
      <table><thead><tr><th>الطلب</th><th>الزبون</th><th>الحالة</th><th>المبلغ</th></tr></thead>
      <tbody>${recentRows}</tbody></table>
    </div>`
}

function renderCosts() {
  const delivered = allOrders.filter(o=>o.status==='delivered')
  const revenue   = delivered.reduce((s,o)=>s+o.total,0)
  const expenses  = allExpenses.reduce((s,e)=>s+e.amount,0)
  const gross     = revenue - delivered.reduce((s,o)=>s+o.items.reduce((ss,i)=>{const p=allProducts.find(p=>p.id===i.productId);return ss+(p?p.cost_price*i.qty:0)},0),0)
  const net       = gross - expenses

  const rows = allExpenses.map(e=>`
    <tr>
      <td style="font-weight:700">${e.label}</td>
      <td>${badge(e.type==='fixed'?'ثابتة':'متغيرة',e.type==='fixed'?'#818cf8':'#f59e0b')}</td>
      <td style="font-weight:800;color:var(--danger)">${Number(e.amount).toLocaleString()} دج</td>
      <td style="font-size:12px;color:rgba(232,238,255,0.5)">${e.expense_date||e.date}</td>
      <td><div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="editExpense('${e.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteExpense('${e.id}')">🗑️</button>
      </div></td>
    </tr>`).join('')

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="page-title" style="margin:0">💰 التكاليف والأرباح</div>
      <button class="btn btn-primary" onclick="addExpense()">+ إضافة تكلفة</button>
    </div>
    <div class="kpi-grid">
      ${kpi(revenue.toLocaleString()+' دج','إجمالي المبيعات','#38bdf8')}
      ${kpi(gross.toLocaleString()+' دج','الربح الإجمالي','#f59e0b',`هامش ${revenue>0?Math.round((gross/revenue)*100):0}%`)}
      ${kpi(expenses.toLocaleString()+' دج','التكاليف التشغيلية','#f43f5e')}
      ${kpi(net.toLocaleString()+' دج','💰 الربح الصافي',net>=0?'#22c55e':'#f43f5e',net>=0?'ربح ✅':'خسارة ⚠️')}
    </div>
    <div class="table-card">
      <div style="font-size:14px;font-weight:800;margin-bottom:12px">📋 قائمة التكاليف</div>

    </div>`}).join('')

  const cartSection = cartCount>0 ? `
    <div style="background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.15);border-radius:16px;padding:16px;margin-top:16px">

      <div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;color:rgba(232,238,255,0.5)"><span>رسوم التوصيل</span><span>50 دج</span></div>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08)"><span>الإجمالي</span><span style="color:var(--accent)">${subtotal+50} دج</span></div>
    </div>
    <div style="margin-top:12px">
      <div class="field-label">📞 رقم الهاتف</div>
      <input class="inp" id="order-phone" value="${currentUser.phone||''}" placeholder="0555123456">
      <div class="field-label">📍 العنوان التفصيلي</div>
      <input class="inp" id="order-address" placeholder="الحي، الشارع، رقم المبنى">

      <button class="btn-primary" onclick="placeOrder()">✅ تأكيد الطلب — ${subtotal+50} دج</button>
    </div>` : ''

  return `
    <div class="cat-row">${catBtns}</div>
    <div class="prod-grid">${prods}</div>
    ${cartSection}`
}

function renderMyHistory() {
  const orders = allOrders.filter(o=>o.customerId===currentUser.id)
  if(orders.length===0) return `<div class="spinner">لم تقدم أي طلب بعد</div>`
  return `<div class="page-title">📋 طلباتي</div>` + orders.map(o=>`
    <div class="order-card" style="border-right-color:${STATUS[o.status]?.c||'#888'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><div style="font-weight:800">${o.id}</div><div style="font-size:11px;color:rgba(232,238,255,0.5)">${o.date}</div></div>
        ${badge(STATUS[o.status]?.l||o.status,STATUS[o.status]?.c||'#888')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:16px;font-weight:900;color:var(--accent)">${o.total} دج</span>
        <button class="btn btn-ghost btn-sm" onclick='printBDC(${JSON.stringify(o).replace(/'/g,"&#39;")})'>🧾 فاتورة</button>
      </div>
    </div>`).join('')
}

function renderPoints() {
  const pts = currentUser.points||0
  const tiers = [{l:'عادي',min:0,e:'🔘',c:'#64748b'},{l:'برونزي',min:200,e:'🥉',c:'#cd7f32'},{l:'فضي',min:500,e:'🥈',c:'#94a3b8'},{l:'ذهبي',min:1000,e:'🥇',c:'#f59e0b'},{l:'بلاتيني',min:2000,e:'💎',c:'#818cf8'}]
  const badge_tier = [...tiers].reverse().find(b=>pts>=b.min)||tiers[0]
  return `
    <div style="background:${badge_tier.c}22;border:1px solid ${badge_tier.c}44;border-radius:20px;padding:28px;text-align:center;margin-bottom:16px">
      <div style="font-size:56px">${badge_tier.e}</div>
      <div style="font-size:32px;font-weight:900;margin-top:8px">${pts.toLocaleString()}</div>
      <div style="font-size:12px;color:rgba(232,238,255,0.5)">نقطة مكتسبة</div>
      <div style="font-size:16px;font-weight:800;color:${badge_tier.c};margin-top:6px">درجة: ${badge_tier.l}</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;color:rgba(232,238,255,0.6);line-height:2.2">
      ⭐ كل <strong style="color:#e8eeff">100 دج</strong> = <strong style="color:var(--warn)">10 نقاط</strong><br>
      🎫 500 نقطة = خصم 10%<br>
      🚚 300 نقطة = توصيل مجاني<br>
      💧 200 نقطة = منتج مجاني
    </div>`
}

  const driver=allUsers.find(u=>u.id===driverId)

  await loadData(); renderPage()

}

async function placeOrder() {
  const phone=document.getElementById('order-phone')?.value
  const address=document.getElementById('order-address')?.value
  const note=document.getElementById('order-note')?.value||''
  if(!phone||!address){alert('يرجى إدخال الهاتف والعنوان');return}

  const cartItems=Object.entries(cart).map(([id,qty])=>({...allProducts.find(p=>p.id===id),qty}))
  const subtotal=cartItems.reduce((s,i)=>s+(i.sell_price||0)*i.qty,0)
  const total=subtotal+50
  const orderId='CMD-'+Date.now().toString().slice(-5)

  const {error:oe}=await db.from('orders').insert({id:orderId,customer_id:currentUser.id,customer_name:currentUser.name,phone,address,city:currentUser.city||address,subtotal,delivery_fee:50,total,status:'pending',note,order_date:new Date().toISOString().split('T')[0]})
  if(oe){alert('خطأ في الطلب: '+oe.message);return}

  const items=cartItems.map(i=>({order_id:orderId,product_id:i.id,name:i.name+' '+i.volume,emoji:i.emoji,quantity:i.qty,unit_price:i.sell_price}))
  await db.from('order_items').insert(items)

  const earned=Math.floor(total/100)*10
  if(earned>0) await db.from('users').update({points:(currentUser.points||0)+earned}).eq('id',currentUser.id)
  currentUser.points=(currentUser.points||0)+earned

  cart={}
  await loadData()
  alert(`🎉 تم تأكيد طلبك!\nرقم الطلب: ${orderId}\n⭐ نقاط مكتسبة: +${earned}`)
  switchTab('my_history')
}
