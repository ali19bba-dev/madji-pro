function sLang(l){
  lang=l;localStorage.setItem('ml',l)
  const r=document.getElementById('R')
  r.setAttribute('lang',l);r.setAttribute('dir',l==='ar'?'rtl':'ltr')
  document.querySelectorAll('.lN').forEach((b,i)=>b.classList.toggle('on',['ar','fr','en'][i]===l))
  ;['ar','fr','en'].forEach(c=>{const f=document.getElementById('f-'+c);if(f)f.style.opacity=c===l?'1':'.45'})
  const m={'sp-s':T('tag'),'l-tg':T('tag'),'l-ti':T('login'),'l-ul':T('un'),'l-pl':T('pw'),'l-btn':T('enter'),'btn-out':T('out')}
  Object.entries(m).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.textContent=v})
  if(CU){rNav();rPage()}
}

window.addEventListener('load',async()=>{
  sLang(lang)
  setTimeout(async()=>{
    const sp=document.getElementById('SP')
    sp.classList.add('out')
    setTimeout(()=>{sp.style.display='none'},450)
    const sv=localStorage.getItem('mj_s')
    if(sv){
      try{
        const s=JSON.parse(sv)
        if(s.exp>Date.now()){
          const{data}=await db.from('users').select('*').eq('id',s.uid).eq('active',true).single()
          if(data&&data.password_hash===s.ph){
            CU=data
            document.getElementById('AP').classList.remove('H')
            document.getElementById('LG').classList.add('H')
            await boot();return
          }
        }
      }catch(e){}
      localStorage.removeItem('mj_s')
    }
    document.getElementById('LG').classList.remove('H')
    document.getElementById('AP').classList.add('H')
  },1800)
})

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement===document.getElementById('l-p'))doLogin()})

async function doLogin(){
  const u=document.getElementById('l-u').value.trim()
  const p=document.getElementById('l-p').value.trim()
  const er=document.getElementById('l-er'),btn=document.getElementById('l-btn')
  er.style.display='none'
  if(!u||!p){er.textContent=T('ef');er.style.display='block';return}
  btn.disabled=true;btn.innerHTML=`<span class="sp"></span>${T('ld')}`
  try{
    const{data,error}=await db.from('users').select('*').eq('username',u).eq('active',true)
    if(error||!data||!data.length)throw new Error(T('eu'))
    const usr=data[0]
    if(usr.password_hash!==p)throw new Error(T('ep'))
    localStorage.setItem('mj_s',JSON.stringify({uid:usr.id,ph:usr.password_hash,exp:Date.now()+30*864e5}))
    CU=usr;sh('AP');hd('LG');await boot()
  }catch(e){er.textContent='⚠️ '+e.message;er.style.display='block'}
  finally{btn.disabled=false;btn.textContent=T('enter')}
}

function doLogout(){
  localStorage.removeItem('mj_s');if(dInt){clearInterval(dInt);dInt=null}
  CU=null;cart={};atab='';hd('AP');sh('LG')
  document.getElementById('l-p').value='';toast('👋 '+T('out'))
}

const RTABS={superadmin:['dashboard','users','products','stock','orders','costs'],orders_admin:['new_orders','ready_orders','transit_orders'],stock_admin:['stock'],driver:['my_orders','done_orders','stats'],customer:['shop','profile','history','points']}

async function boot(){
  document.getElementById('u-b').textContent=(TX[lang].ro[CU.role]||CU.role)+' — '+CU.name
  document.getElementById('btn-out').textContent=T('out')
  const sv=localStorage.getItem('sp_'+CU.id);if(sv)try{SP={...SP,...JSON.parse(sv)}}catch(e){}
  if(CU.role==='driver')sDrv()
  await loadAll();rNav();sw(RTABS[CU.role]?.[0]||'');sLang(lang)
}

async function loadAll(){
  const[p,o,u,e]=await Promise.all([
    db.from('products').select('*').eq('active',true).order('category'),
    db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}),
    db.from('users').select('id,name,username,role,phone,city,zone,points,active,created_at').order('created_at'),
    db.from('expenses').select('*').order('expense_date',{ascending:false})
  ])
  AP=p.data||[];AO=(o.data||[]).map(mo);AU=u.data||[];AE=e.data||[]

function aPr(){oM(T('ap'),`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div style="grid-column:1/-1"><div class="fl">${T('nm')}</div><input class="inp" id="fn" style="margin-bottom:0"></div><div><div class="fl">${T('sp2')}</div><input class="inp" id="fsp" type="number" style="margin-bottom:0"></div><div><div class="fl">${T('cp')}</div><input class="inp" id="fcp" type="number" style="margin-bottom:0"></div><div><div class="fl">${T('qt')}</div><input class="inp" id="fq" type="number" style="margin-bottom:0"></div><div><div class="fl">${T('ms')}</div><input class="inp" id="fm" type="number" value="30" style="margin-bottom:0"></div><div><div class="fl">${T('vl')}</div><input class="inp" id="fv" placeholder="1.5L" style="margin-bottom:0"></div><div><div class="fl">Emoji</div><input class="inp" id="fe" value="🥤" style="margin-bottom:0"></div></div><div class="fl">${T('xd')}</div><input class="inp" id="fex" type="date" style="margin-bottom:0"><div class="fl">${T('vc')}</div><select class="sel" id="fcat"><option value="غازية">${TX[lang].cat.g}</option><option value="غير غازية">${TX[lang].cat.ng}</option><option value="ماء">${TX[lang].cat.w}</option></select><div style="display:flex;gap:7px"><button class="btn bP" style="flex:1" onclick="svP()">${T('sv')}</button><button class="btn bG" style="flex:1" onclick="cM()">${T('cn')}</button></div>`)}
async function svP(){const p={name:document.getElementById('fn').value,emoji:document.getElementById('fe').value,sell_price:+document.getElementById('fsp').value,cost_price:+document.getElementById('fcp').value,stock:+document.getElementById('fq').value,min_stock:+document.getElementById('fm').value,volume:document.getElementById('fv').value,expiry_date:document.getElementById('fex').value,category:document.getElementById('fcat').value,active:true};if(!p.name||!p.sell_price){toast('⚠️ '+T('ef'));return};const{error}=await db.from('products').insert(p);if(error){toast('❌ '+error.message);return};cM();await loadAll();rPage();toast('✅ '+p.name)}
function eP(id){const p=AP.find(x=>x.id===id);if(!p)return;oM(T('ed'),`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div style="grid-column:1/-1"><div class="fl">${T('nm')}</div><input class="inp" id="fn" value="${p.name}" style="margin-bottom:0"></div><div><div class="fl">${T('sp2')}</div><input class="inp" id="fsp" type="number" value="${p.sell_price}" style="margin-bottom:0"></div><div><div class="fl">${T('cp')}</div><input class="inp" id="fcp" type="number" value="${p.cost_price}" style="margin-bottom:0"></div><div><div class="fl">${T('qt')}</div><input class="inp" id="fq" type="number" value="${p.stock}" style="margin-bottom:0"></div><div><div class="fl">${T('ms')}</div><input class="inp" id="fm" type="number" value="${p.min_stock}" style="margin-bottom:0"></div><div><div class="fl">${T('vl')}</div><input class="inp" id="fv" value="${p.volume}" style="margin-bottom:0"></div><div><div class="fl">Emoji</div><input class="inp" id="fe" value="${p.emoji||'🥤'}" style="margin-bottom:0"></div></div><div class="fl">${T('xd')}</div><input class="inp" id="fex" type="date" value="${p.expiry_date}" style="margin-bottom:13px"><div style="display:flex;gap:7px"><button class="btn bP" style="flex:1" onclick="svEP('${id}')">${T('sv')}</button><button class="btn bG" style="flex:1" onclick="cM()">${T('cn')}</button></div>`)}
async function svEP(id){const up={name:document.getElementById('fn').value,emoji:document.getElementById('fe').value,sell_price:+document.getElementById('fsp').value,cost_price:+document.getElementById('fcp').value,stock:+document.getElementById('fq').value,min_stock:+document.getElementById('fm').value,volume:document.getElementById('fv').value,expiry_date:document.getElementById('fex').value};await db.from('products').update(up).eq('id',id);cM();await loadAll();rPage();toast('✅')}
async function dP(id){if(!confirm(T('cd')))return;await db.from('products').update({active:false}).eq('id',id);await loadAll();rPage()}

function aS(id,n){oM(T('aq')+' — '+n,`<div class="fl">${lang==='ar'?'الكمية المضافة':'Quantité'}</div><input class="inp" id="fq" type="number" placeholder="100" style="margin-bottom:13px"><div style="display:flex;gap:7px"><button class="btn bP" style="flex:1" onclick="svS('${id}','add')">${T('sv')}</button><button class="btn bG" style="flex:1" onclick="cM()">${T('cn')}</button></div>`)}
function sS(id,n,c){oM(T('sq')+' — '+n,`<div style="text-align:center;margin-bottom:11px"><div style="font-size:11px;color:var(--mu)">${lang==='ar'?'الحالية':'Actuel'}</div><div style="font-size:30px;font-weight:900;color:var(--a)">${c}</div></div><div class="fl">${lang==='ar'?'الجديدة':'Nouveau'}</div><input class="inp" id="fq" type="number" value="${c}" style="margin-bottom:13px"><div style="display:flex;gap:7px"><button class="btn bP" style="flex:1" onclick="svS('${id}','set')">${T('sv')}</button><button class="btn bG" style="flex:1" onclick="cM()">${T('cn')}</button></div>`)}
async function svS(id,m){const q=+document.getElementById('fq').value;if(q<0)return;const p=AP.find(x=>x.id===id);const ns=m==='add'?p.stock+q:q;await db.from('products').update({stock:ns}).eq('id',id);cM();await loadAll();rPage();toast('✅ '+ns)}

function aE(){oM(T('ae'),`<div class="fl">${lang==='ar'?'الوصف':'Description'}</div><input class="inp" id="fl2" style="margin-bottom:0"><div class="fl">${T('am')} (${T('dz')})</div><input class="inp" id="fa" type="number" style="margin-bottom:0"><div class="fl">${T('tp')}</div><select class="sel" id="ft"><option value="fixed">${T('fx')}</option><option value="variable">${T('vr')}</option></select><div style="display:flex;gap:7px"><button class="btn bP" style="flex:1" onclick="svE()">${T('sv')}</button><button class="btn bG" style="flex:1" onclick="cM()">${T('cn')}</button></div>`)}
async function svE(){const l=document.getElementById('fl2').value,a=+document.getElementById('fa').value,t=document.getElementById('ft').value;if(!l||!a){toast('⚠️ '+T('ef'));return};await db.from('expenses').insert({label:l,amount:a,type:t,expense_date:new Date().toISOString().split('T')[0]});cM();await loadAll();rPage();toast('✅')}
function eE(id){const e=AE.find(x=>x.id===id);if(!e)return;oM(T('ed'),`<div class="fl">${lang==='ar'?'الوصف':'Description'}</div><input class="inp" id="fl2" value="${e.label}" style="margin-bottom:0"><div class="fl">${T('am')}</div><input class="inp" id="fa" type="number" value="${e.amount}" style="margin-bottom:0"><div class="fl">${T('tp')}</div><select class="sel" id="ft"><option value="fixed" ${e.type==='fixed'?'selected':''}>${T('fx')}</option><option value="variable" ${e.type==='variable'?'selected':''}>${T('vr')}</option></select><div style="display:flex;gap:7px"><button class="btn bP" style="flex:1" onclick="svEE('${id}')">${T('sv')}</button><button class="btn bG" style="flex:1" onclick="cM()">${T('cn')}</button></div>`)}
async function svEE(id){await db.from('expenses').update({label:document.getElementById('fl2').value,amount:+document.getElementById('fa').value,type:document.getElementById('ft').value}).eq('id',id);cM();await loadAll();rPage();toast('✅')}
async function dE(id){if(!confirm(T('cd')))return;await db.from('expenses').delete().eq('id',id);await loadAll();rPage()}

async function mkR(id){await db.from('orders').update({status:'ready',printed:true}).eq('id',id);await loadAll();rPage();toast('📦')}
async function aD(oid,did){if(!did)return;const d=AU.find(u=>u.id===did);await db.from('orders').update({status:'in_transit',driver_id:did,driver_name:d?.name||''}).eq('id',oid);await loadAll();rPage();toast('🚗 '+d?.name)}
