<html id="html-root" dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#38bdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MADJI PRO">
<link rel="manifest" href="manifest.json">
<title>MADJI PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#38bdf8;--accent2:#818cf8;--success:#22c55e;
  --warn:#f59e0b;--danger:#f43f5e;
  --border:rgba(255,255,255,0.08);--surface:rgba(255,255,255,0.04);
  --bg:#070d1a;--text:#e8eeff;--muted:rgba(232,238,255,0.5);
}
html[lang="ar"]{direction:rtl;font-family:'Cairo',sans-serif}
html[lang="fr"],html[lang="en"]{direction:ltr;font-family:'Poppins','Cairo',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
input,button,select,textarea{font-family:inherit}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s}
#splash.fade-out{opacity:0;pointer-events:none}
.splash-logo{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.splash-title{font-size:36px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:16px}
.splash-sub{font-size:13px;color:var(--muted);margin-top:6px}
.splash-loader{width:48px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:32px;overflow:hidden}
.splash-loader-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;animation:load 1.8s ease-in-out forwards}
@keyframes load{0%{width:0%}100%{width:100%}}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,rgba(56,189,248,0.1),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(129,140,248,0.08),transparent 60%),var(--bg)}
.login-box{width:100%;max-width:380px}
.login-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:24px;padding:28px;backdrop-filter:blur(20px)}
.lang-row{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.lang-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);font-size:13px;cursor:pointer;transition:all 0.2s;font-family:inherit}
.lang-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--bg);border:none;font-weight:700}

/* ── SHELL ── */
#app-screen{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,0.025);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.topbar-logo{font-size:17px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.topbar-right{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-badge{font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);color:var(--accent);white-space:nowrap}
.navtabs{display:flex;gap:0;padding:0 12px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.015);overflow-x:auto;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtab{padding:11px 14px;border:none;background:none;color:var(--muted);font-weight:500;font-size:12px;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;flex-shrink:0}
.navtab.active{color:var(--accent);font-weight:800;border-bottom-color:var(--accent)}
.page{flex:1;padding:16px;overflow:auto;padding-bottom:80px}

/* ── COMPONENTS ── */
.btn{padding:9px 16px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--bg)}
.btn-success{background:var(--success);color:var(--bg)}
.btn-danger{background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.3);color:var(--danger)}
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text)}
.btn-full{width:100%;justify-content:center;padding:14px}
.btn-sm{padding:5px 11px;font-size:11px}
.inp{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s}
.inp:focus{border-color:var(--accent)}
.sel{width:100%;background:#0d1829;border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.field-label{font-size:12px;color:var(--muted);margin-bottom:5px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.page-title{font-size:20px;font-weight:900;margin-bottom:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;border-top:3px solid var(--accent)}
.kpi-val{font-size:22px;font-weight:900;color:var(--accent)}
.kpi-label{font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:700}
.alert{border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert-danger{background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.25)}
.alert-warn{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25)}
.alert-info{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px;text-align:inherit;border-bottom:1px solid var(--border)}
td{font-size:13px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);padding:0}
.modal-box{background:#0d1829;border:1px solid var(--border);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:17px;font-weight:900;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform 0.2s}
.prod-top{padding:14px 10px 10px;text-align:center;background:linear-gradient(135deg,rgba(56,189,248,0.08),rgba(129,140,248,0.05))}
.prod-bot{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.qty-row{display:flex;align-items:center;gap:5px;background:rgba(56,189,248,0.08);border-radius:8px;padding:2px 5px}
.qty-btn{width:24px;height:24px;border-radius:6px;background:rgba(56,189,248,0.15);border:none;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.add-btn{width:32px;height:32px;border-radius:9px;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);color:var(--accent);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cat-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cat-btn{padding:7px 16px;border-radius:50px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all 0.2s;flex-shrink:0}
.cat-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:var(--bg);font-weight:800}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;border-inline-start:3px solid var(--accent)}
.gps-box{border-radius:12px;padding:14px;margin-bottom:12px}
.gps-box-idle{background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.2)}
.gps-box-done{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3)}
.spinner-inline{display:inline-block;width:16px;height:16px;border:2px solid rgba(56,189,248,0.3);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-inline-end:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-wrap{height:5px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.5s}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;z-index:9998;animation:fadeInUp 0.3s ease;max-width:320px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}.prod-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

function setLang(l) {
  lang = l
  localStorage.setItem('madji_lang', l)
  const html = document.getElementById('html-root')
  html.setAttribute('lang', l)
  html.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr')

  // Update login page text
  document.querySelectorAll('.lang-btn').forEach((b,i) => {
    b.classList.toggle('active', ['ar','fr','en'][i] === l)
  })
  const tagline = document.getElementById('login-tagline')
  if(tagline) tagline.textContent = t('tagline')
  const splashSub = document.getElementById('splash-sub')
  if(splashSub) splashSub.textContent = t('tagline')

  const loginTitle = document.getElementById('login-title')
  if(loginTitle) loginTitle.textContent = t('login')
  const lblUser = document.getElementById('lbl-username')
  if(lblUser) lblUser.textContent = t('username')
  const lblPass = document.getElementById('lbl-password')
  if(lblPass) lblPass.textContent = t('password')
  const btnLogin = document.getElementById('btn-login')
  if(btnLogin) btnLogin.textContent = t('enter')
  const btnLogout = document.getElementById('btn-logout')
  if(btnLogout) btnLogout.textContent = t('logout')

  // Update flag opacity
  ;['ar','fr','en'].forEach(code => {
    const flag = document.getElementById('flag-'+code)
    if(flag) flag.style.opacity = code === l ? '1' : '0.5'
  })

  if(currentUser) { renderNav(); renderPage() }
}

window.addEventListener('load', async () => {
  setLang(lang)
  setTimeout(async () => {
    const splash = document.getElementById('splash')
    splash.classList.add('fade-out')
    setTimeout(() => splash.style.display = 'none', 500)

    // Check saved session (persistent login)
    const saved = localStorage.getItem('madji_session')
    if(saved) {
      try {
        const session = JSON.parse(saved)
        // Verify session not expired (30 days)
        if(session.expiry > Date.now()) {
          // Re-verify user from DB
          const { data } = await db.from('users').select('*').eq('id', session.userId).eq('active', true).single()
          if(data && data.password_hash === session.passwordHash) {
            currentUser = data
            document.getElementById('login-screen').classList.add('hidden')
            document.getElementById('app-screen').classList.remove('hidden')
            await initApp()
            return
          }
        }
      } catch(e) {}
      localStorage.removeItem('madji_session')
    }
    document.getElementById('login-screen').classList.remove('hidden')
  }, 1800)
})

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && document.getElementById('inp-password') === document.activeElement) doLogin()
})

async function doLogin() {
  const username = document.getElementById('inp-username').value.trim()
  const password = document.getElementById('inp-password').value.trim()
  const errEl = document.getElementById('login-error')
  const btnLogin = document.getElementById('btn-login')
  errEl.style.display = 'none'

  if(!username || !password) {
    errEl.textContent = t('fillFields'); errEl.style.display = 'block'; return
  }

  btnLogin.disabled = true
  btnLogin.innerHTML = `<span class="spinner-inline"></span> ${t('loading')}`

  try {
    const { data, error } = await db.from('users').select('*').eq('username', username).eq('active', true)
    if(error || !data || data.length === 0) throw new Error(t('wrongUser'))
    const user = data[0]
    if(user.password_hash !== password) throw new Error(t('wrongPass'))

    // Save persistent session (30 days)
    localStorage.setItem('madji_session', JSON.stringify({
      userId: user.id,
      passwordHash: user.password_hash,
      expiry: Date.now() + (30 * 24 * 60 * 60 * 1000)
    }))

    currentUser = user
    document.getElementById('login-screen').classList.add('hidden')
    document.getElementById('app-screen').classList.remove('hidden')
    await initApp()
  } catch(e) {
    errEl.textContent = '⚠️ ' + e.message; errEl.style.display = 'block'
  } finally {
    btnLogin.disabled = false; btnLogin.textContent = t('enter')
  }
}

function doLogout() {
  localStorage.removeItem('madji_session')
  currentUser = null; cart = {}; activeTab = ''
  if(driverLocationInterval) { clearInterval(driverLocationInterval); driverLocationInterval = null }
  document.getElementById('app-screen').classList.add('hidden')
  document.getElementById('login-screen').classList.remove('hidden')
  document.getElementById('inp-password').value = ''
  showToast('👋 ' + t('logout'))
}

const ROLE_TABS = {
  superadmin:   ['dashboard','users','products','stock','orders','costs'],

  stock_admin:  ['stock'],

async function initApp() {
  const role = currentUser.role
  document.getElementById('user-badge').textContent = t('roles')[role] + ' — ' + currentUser.name
  document.getElementById('btn-logout').textContent = t('logout')

  // Load shop profile from localStorage
  const savedProfile = localStorage.getItem('shopProfile_' + currentUser.id)
  if(savedProfile) try { shopProfile = {...shopProfile, ...JSON.parse(savedProfile)} } catch(e){}

  // Start driver location tracking
  if(role === 'driver') startDriverTracking()

  await loadData()
  renderNav()
  const tabs = ROLE_TABS[role] || []
  switchTab(tabs[0] || '')
  setLang(lang)
}

function renderNav() {
  const tabs = ROLE_TABS[currentUser?.role] || []
  document.getElementById('navtabs').innerHTML = tabs.map(k =>
    `<button class="navtab ${k===activeTab?'active':''}" onclick="switchTab('${k}')">${tTab(k)}</button>`
  ).join('')
}

async function loadData() {
  const [p, o, u, e] = await Promise.all([
    db.from('products').select('*').eq('active', true).order('category'),
    db.from('orders').select('*, order_items(*)').order('created_at', {ascending:false}),
    db.from('users').select('id,name,username,role,phone,city,zone,points,active,created_at').order('created_at'),
    db.from('expenses').select('*').order('expense_date', {ascending:false}),
  ])
  allProducts = p.data || []
  allOrders   = (o.data || []).map(mapOrder)
  allUsers    = u.data || []
  allExpenses = e.data || []
}

function mapOrder(o) {
  return {
    id:o.id, customerId:o.customer_id, customerName:o.customer_name,
    phone:o.phone, address:o.address, city:o.city,
    subtotal:o.subtotal, delivery:o.delivery_fee, total:o.total,
    status:o.status, driverId:o.driver_id, driverName:o.driver_name,
    note:o.note, printed:o.printed, date:o.order_date,
    items:(o.order_items||[]).map(i=>({productId:i.product_id,name:i.name,emoji:i.emoji,qty:i.quantity,price:i.unit_price}))
  }
}

function switchTab(key) {

function getOrderGPS() {
  const s = document.getElementById('gps-order-status')
  if(s){ s.innerHTML=`<span class="spinner-inline"></span>${t('gps_loading')}`; s.style.color='var(--accent)' }
  if(!navigator.geolocation){
    if(s){ s.textContent=t('gps_err2'); s.style.color='var(--danger)' }
    return
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      orderLocation.lat = pos.coords.latitude
      orderLocation.lng = pos.coords.longitude
      renderPage()
      showToast('📍 ' + t('gps_done'))
    },
    err => {
      const msgs = {1:t('gps_err1'),2:t('gps_err2'),3:t('gps_err3')}
      const s = document.getElementById('gps-order-status')
      if(s){ s.textContent=msgs[err.code]||t('gps_err2'); s.style.color='var(--danger)' }
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  )
}

function startDriverTracking() {
  if(!navigator.geolocation) return
  if(driverLocationInterval) clearInterval(driverLocationInterval)
  const updatePos = () => {
    navigator.geolocation.getCurrentPosition(pos => {
      db.from('users').update({
        city: `GPS:${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`
      }).eq('id', currentUser.id).then(()=>{})
    }, ()=>{}, {enableHighAccuracy:true, timeout:10000})
  }
  updatePos()
  driverLocationInterval = setInterval(updatePos, 30000)
}

function renderDashboard() {
  const delivered = allOrders.filter(o=>o.status==='delivered')
  const revenue = delivered.reduce((s,o)=>s+o.total,0)
  const expenses = allExpenses.reduce((s,e)=>s+e.amount,0)
  const net = revenue - expenses
  const today = new Date().toISOString().split('T')[0]
  const todayOrders = allOrders.filter(o=>o.date===today)
  const expired = allProducts.filter(p=>daysUntil(p.expiry_date)<=0)
  const expiring = allProducts.filter(p=>daysUntil(p.expiry_date)>0&&daysUntil(p.expiry_date)<=60)
  const lowStock = allProducts.filter(p=>p.stock<p.min_stock)

  const alerts = [
    ...expired.map(p=>`<div class="alert alert-danger">🚨 <span><b>${p.name}</b> — ${lang==='ar'?'انتهت الصلاحية!':lang==='fr'?'Expiré!':'Expired!'}</span></div>`),
    ...expiring.map(p=>`<div class="alert alert-warn">⚠️ <span><b>${p.name}</b> — ${daysUntil(p.expiry_date)} ${lang==='ar'?'يوم':lang==='fr'?'jours':'days'}</span></div>`),
    ...lowStock.map(p=>`<div class="alert alert-info">📦 <span><b>${p.name}</b> — ${t('low_stock')}: ${p.stock}</span></div>`),
  ].join('')

  const recentRows = allOrders.slice(0,5).map(o=>`
    <tr>
      <td style="color:var(--accent);font-weight:700;font-size:11px">${o.id}</td>
      <td style="font-weight:600">${o.customerName}</td>
      <td>${badge(tStatus(o.status), STATUS_COLORS[o.status]||'#888')}</td>
      <td style="font-weight:800">${dz(o.total)}</td>
    </tr>`).join('')

  return `
    <div class="page-title">${tTab('dashboard')}</div>
    ${alerts}
    <div class="kpi-grid">
      ${kpi(dz(revenue), t('revenue'), 'var(--accent)')}
      ${kpi(dz(net), t('net_profit'), net>=0?'var(--success)':'var(--danger)', net>=0?'✅':'⚠️')}
      ${kpi(todayOrders.length, t('today_orders'), 'var(--accent2)')}
      ${kpi(allUsers.filter(u=>u.active).length, t('active_users'), 'var(--warn)')}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:800;margin-bottom:12px">🛒 ${lang==='ar'?'آخر الطلبات':lang==='fr'?'Dernières commandes':'Latest Orders'}</div>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>${lang==='ar'?'رقم الطلب':'N° commande'}</th>
        <th>${lang==='ar'?'الزبون':lang==='fr'?'Client':'Customer'}</th>
        <th>${lang==='ar'?'الحالة':lang==='fr'?'Statut':'Status'}</th>
        <th>${lang==='ar'?'المبلغ':lang==='fr'?'Montant':'Amount'}</th>
      </tr></thead><tbody>${recentRows}</tbody></table></div>
    </div>`
}

function renderStock() {
  const cards = allProducts.map(p=>{
    const pct = Math.min(100,(p.stock/(p.min_stock*5))*100)
    const fc = p.stock<p.min_stock?'var(--danger)':p.stock<p.min_stock*2?'var(--warn)':'var(--success)'
    const days = daysUntil(p.expiry_date)
    const ec = days<=0?'var(--danger)':days<=60?'var(--warn)':'var(--success)'
    return `
    <div class="card" style="border-inline-start:3px solid ${fc}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:26px">${p.emoji}</span>
          <div>
            <div style="font-size:14px;font-weight:800">${p.name}</div>
            <div style="font-size:11px;color:var(--muted)">${p.volume} — ${p.category}</div>
          </div>
        </div>
        <div style="text-align:${lang==='ar'?'left':'right'}">
          <div style="font-size:24px;font-weight:900;color:${fc}">${p.stock}</div>
          <div style="font-size:10px;color:var(--muted)">${lang==='ar'?'من':lang==='fr'?'sur':'of'} ${p.min_stock*5}</div>
        </div>
      </div>
      <div class="progress-wrap" style="margin-bottom:10px">
        <div class="progress-fill" style="width:${pct}%;background:${fc}"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
        <div style="color:var(--muted)">
          ${lang==='ar'?'الحد الأدنى':lang==='fr'?'Min':'Min'}: <strong style="color:var(--text)">${p.min_stock}</strong>
          &nbsp;|&nbsp;
          <span style="color:${ec}">${days<=0?(lang==='ar'?'منتهية':lang==='fr'?'Expiré':'Expired'):`${days}j`}</span>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="setStock('${p.id}','${p.name}',${p.stock})">${t('set_qty')}</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--success);border-color:rgba(34,197,94,0.3)" onclick="addStock('${p.id}','${p.name}')">${t('add_qty')}</button>
        </div>
      </div>
    </div>`}).join('')

  return `
    <div class="page-title">${tTab('stock')}</div>
    <div class="kpi-grid">
      ${kpi(allProducts.reduce((s,p)=>s+p.stock,0).toLocaleString(), t('total_stock'), 'var(--accent)')}
      ${kpi(allProducts.filter(p=>p.stock<p.min_stock).length, t('low_stock'), 'var(--warn)')}
      ${kpi(allProducts.filter(p=>daysUntil(p.expiry_date)<=0).length, t('expired'), 'var(--danger)')}
      ${kpi(allProducts.length, t('product_types'), 'var(--accent2)')}
    </div>
    ${cards}`
}

function renderCosts() {
  const delivered = allOrders.filter(o=>o.status==='delivered')
  const revenue = delivered.reduce((s,o)=>s+o.total,0)
  const costGoods = delivered.reduce((s,o)=>s+o.items.reduce((ss,i)=>{const p=allProducts.find(p=>p.id===i.productId);return ss+(p?p.cost_price*i.qty:0)},0),0)
  const expenses = allExpenses.reduce((s,e)=>s+e.amount,0)
  const gross = revenue - costGoods
  const net = gross - expenses

  const rows = allExpenses.map(e=>`
    <tr>
      <td style="font-weight:700">${e.label}</td>
      <td>${badge(e.type==='fixed'?(lang==='ar'?'ثابتة':lang==='fr'?'Fixe':'Fixed'):(lang==='ar'?'متغيرة':lang==='fr'?'Variable':'Variable'), e.type==='fixed'?'#818cf8':'#f59e0b')}</td>
      <td style="font-weight:800;color:var(--danger)">${dz(e.amount)}</td>

        <div style="display:flex;gap:5px">
          <button class="btn btn-ghost btn-sm" onclick="editExpense('${e.id}')">${t('edit')}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteExpense('${e.id}')">🗑️</button>
        </div>
      </td>
    </tr>`).join('')

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="page-title" style="margin:0">${tTab('costs')}</div>
      <button class="btn btn-primary btn-sm" onclick="addExpense()">${t('add_expense')}</button>
    </div>
    <div class="kpi-grid">
      ${kpi(dz(revenue), t('revenue'), 'var(--accent)')}
      ${kpi(dz(gross), t('gross_profit'), 'var(--warn)', revenue>0?Math.round((gross/revenue)*100)+'%':'')}
      ${kpi(dz(expenses), t('op_costs'), 'var(--danger)')}
      ${kpi(dz(net), t('net_profit'), net>=0?'var(--success)':'var(--danger)', net>=0?'✅':'⚠️')}
    </div>
    <div style="overflow-x:auto"><div class="card" style="padding:0">
      <table><thead><tr>
        <th style="padding:10px">${lang==='ar'?'التكلفة':lang==='fr'?'Charge':'Expense'}</th>

}

function getProfileGPS() {
  const s = document.getElementById('gps-profile-status')
  if(s){ s.innerHTML=`<span class="spinner-inline"></span>${t('gps_loading')}`; s.style.color='var(--accent)' }
  if(!navigator.geolocation){ if(s){ s.textContent=t('gps_err2'); s.style.color='var(--danger)' } return }
  navigator.geolocation.getCurrentPosition(
    pos => { shopProfile.lat=pos.coords.latitude; shopProfile.lng=pos.coords.longitude; renderPage(); showToast('📍 '+t('gps_done')) },
    err => { const m={1:t('gps_err1'),2:t('gps_err2'),3:t('gps_err3')}; const s=document.getElementById('gps-profile-status'); if(s){ s.textContent=m[err.code]||t('gps_err2'); s.style.color='var(--danger)' } },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  )
}
function onProfileWilayaChange(val) { shopProfile.wilaya=val; shopProfile.commune=''; renderPage(); setTimeout(()=>{const s=document.getElementById('p-wilaya');if(s)s.value=val},50) }
function handleShopPhoto(input) { const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{shopProfile.photoUrl=e.target.result;renderPage()};r.readAsDataURL(f) }
async function saveProfile() {
  shopProfile.shopName=document.getElementById('p-shopName')?.value||''
  shopProfile.activityType=document.getElementById('p-activityType')?.value||''
  shopProfile.startDate=document.getElementById('p-startDate')?.value||''

function renderPoints() {
  const pts = currentUser.points||0
  const tiers = [
    {l:t('tier_normal'), min:0, e:'🔘', c:'#64748b'},
    {l:t('tier_bronze'), min:200, e:'🥉', c:'#cd7f32'},
    {l:t('tier_silver'), min:500, e:'🥈', c:'#94a3b8'},
    {l:t('tier_gold'),   min:1000, e:'🥇', c:'#f59e0b'},
    {l:t('tier_platinum'),min:2000,e:'💎', c:'#818cf8'},
  ]
  const tier = [...tiers].reverse().find(b=>pts>=b.min)||tiers[0]
  const nextTier = tiers.find(b=>b.min>pts)
  const progress = nextTier ? Math.round((pts-tier.min)/(nextTier.min-tier.min)*100) : 100

  return `
    <div class="page-title">${tTab('points')}</div>
    <div style="background:${tier.c}22;border:1px solid ${tier.c}44;border-radius:20px;padding:28px;text-align:center;margin-bottom:16px">
      <div style="font-size:56px">${tier.e}</div>

      <div style="font-size:12px;color:var(--muted)">${lang==='ar'?'نقطة مكتسبة':lang==='fr'?'Points gagnés':'Earned Points'}</div>
      <div style="font-size:16px;font-weight:800;color:${tier.c};margin-top:6px">${tier.l}</div>
      ${nextTier?`
      <div style="margin-top:14px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${pts} / ${nextTier.min} ${lang==='ar'?'نقطة للمستوى القادم':lang==='fr'?'pts pour niveau suivant':'pts to next level'}</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${progress}%;background:${tier.c}"></div></div>
      </div>`:''}
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:800;margin-bottom:12px">${lang==='ar'?'نظام النقاط':lang==='fr'?'Système de points':'Points System'}</div>
      <div style="font-size:13px;color:var(--muted);line-height:2.2">
        ${t('points_desc')}<br>
        🎫 500 ${lang==='ar'?'نقطة':lang==='fr'?'pts':'pts'} = ${t('reward_discount')} 10%<br>
        🚚 300 ${lang==='ar'?'نقطة':lang==='fr'?'pts':'pts'} = ${t('reward_delivery')}<br>
        💧 200 ${lang==='ar'?'نقطة':lang==='fr'?'pts':'pts'} = ${t('reward_product')}
      </div>
    </div>`
}

//  PLACE ORDER
// ════════════════════════════════════════════════
async function placeOrder() {
  const phone = document.getElementById('order-phone')?.value
  const addrInput = document.getElementById('order-address')?.value
  const note = document.getElementById('order-note')?.value||''
  orderLocation.address = addrInput||''
  const commune = document.getElementById('order-commune')?.value||orderLocation.commune||''
  const wilaya = orderLocation.wilaya||''
  const fullAddress = [addrInput, commune, wilaya].filter(Boolean).join(' — ')

  if(!phone){ showToast('⚠️ '+t('phone')); return }
  if(!wilaya){ showToast('⚠️ '+t('wilaya')); return }
  if(!addrInput){ showToast('⚠️ '+t('address')); return }

  const cartItems = Object.entries(cart).map(([id,qty])=>({...allProducts.find(p=>p.id===id),qty}))
  const subtotal = cartItems.reduce((s,i)=>s+(i.sell_price||0)*i.qty,0)
  const total = subtotal+50
  const orderId = 'CMD-'+Date.now().toString().slice(-5)
  const gpsNote = orderLocation.lat ? `GPS:${orderLocation.lat.toFixed(6)},${orderLocation.lng.toFixed(6)}` : ''
  const fullNote = [note, gpsNote].filter(Boolean).join(' | ')

  const {error} = await db.from('orders').insert({
    id:orderId, customer_id:currentUser.id, customer_name:currentUser.name,
    phone, address:fullAddress, city:wilaya, subtotal, delivery_fee:50, total,
    status:'pending', note:fullNote, order_date:new Date().toISOString().split('T')[0]
  })
  if(error){ showToast('❌ '+error.message); return }

  await db.from('order_items').insert(cartItems.map(i=>({
    order_id:orderId, product_id:i.id, name:i.name+' '+i.volume,
    emoji:i.emoji, quantity:i.qty, unit_price:i.sell_price
  })))

  const earned = Math.floor(total/100)*10
  if(earned>0) await db.from('users').update({points:(currentUser.points||0)+earned}).eq('id',currentUser.id)
  currentUser.points = (currentUser.points||0)+earned
  cart = {}
  orderLocation = {lat:null,lng:null,wilaya:'',commune:'',address:''}
  await loadData()
  showToast(`🎉 ${t('order_confirmed')} — ${orderId}`, 5000)
  switchTab('my_history')
}

async function saveEditUser(id) {
  const update={name:document.getElementById('f-name').value,phone:document.getElementById('f-phone').value,city:document.getElementById('f-city').value}
  const pass=document.getElementById('f-pass').value
  if(pass) update.password_hash=pass
  await db.from('users').update(update).eq('id',id)
  closeModal(); await loadData(); renderPage(); showToast('✅ '+t('save'))
}

async function toggleUser(id,active) {
  await db.from('users').update({active}).eq('id',id)
  await loadData(); renderPage()
}
